[package]
name = "cogbench-sim"
description = "Deterministic falling-sand simulation core for the Noita-like cogbench environment"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "cogbench_sim"

[dependencies]
flate2 = "1.1.10"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "step"
harness = false
