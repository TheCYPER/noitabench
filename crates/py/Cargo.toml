[package]
name = "cogbench-py"
description = "PyO3 bindings: the Python module noitabench_core (wrappers only, no game logic)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "noitabench_core"
crate-type = ["cdylib", "rlib"]
# Nothing to unit-test here (it only wraps cogbench-sim and cogbench-game); also avoids linking libpython in `cargo test`.
test = false
doctest = false

[dependencies]
cogbench-game = { version = "0.1.0", path = "../game" }
cogbench-rules = { version = "0.1.0", path = "../rules" }
cogbench-sim = { version = "0.1.0", path = "../sim" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde_json = "1.0.154"
