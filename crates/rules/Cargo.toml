[package]
name = "cogbench-rules"
description = "The original cogbench reaction table with its solvability questions, and the secret potion recipes of a rule seed"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "cogbench_rules"

[dependencies]
cogbench-sim = { path = "../sim" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
