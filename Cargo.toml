[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false
rust-version = "1.90"

[profile.dev]
# The simulation is a hot loop: unoptimised test runs are too slow to be useful.
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
