[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "noitabench"
version = "0.1.0"
description = "Noita-like LLM agent capability benchmark: simulation core and tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "numpy", "pillow>=10.1", "scipy"]
harness = ["anthropic>=2.3", "openai>=3.39", "google-genai>=2.33"]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "noitabench_core"
python-source = "python"
python-packages = ["noitabench"]
# `extension-module` stops pyo3 from linking libpython, which is what a Python extension needs
# and what `cargo test` / `cargo build` for the workspace must not do.
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"
